  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script>if (/[?&]prova=[^&]*space/.test(location.search)) document.documentElement.classList.add('prova-space');
  // PROVA `?prova=vh` (17.09.26): #app torna alto 100vh (prima di ieri), per vedere se il tremolio
  // dei bordi su iPhone viene da 100dvh che cambia quando si muovono le barre di Safari
  if (/[?&]prova=[^&]*\bvh\b/.test(location.search)) document.documentElement.classList.add('prova-vh');</script>
  <style>html.prova-vh #app { height: 100vh !important; }</style>
  <script>
  // PROVA `?prova=noblend` (17.09.26): via mix-blend-mode dagli elementi FISSI sopra lo scroll
  // (#mobile-nav, #sidebar, #home-logo-mirror...). Sospetto per "su iPhone i bordi delle sezioni
  // tremano, in tutte le sezioni, anche col JS spento": il blend su un layer fisso obbliga a
  // ricomporre a ogni frame cio' che scorre sotto.
  if (/[?&]prova=[^&]*noblend/.test(location.search))
    document.write('<style>*, *::before, *::after { mix-blend-mode: normal !important; }</style>');
  </script>
</head>
